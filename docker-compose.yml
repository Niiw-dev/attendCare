version: '3.9'

services:

  db:
    image: postgres:15
    container_name: church_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: church_backend
    command: sh /app/docker/backend/entrypoint.sh
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: church_frontend
    ports:
      - "5173:5173"
    command: npm run dev -- --host

volumes:
  postgres_data: