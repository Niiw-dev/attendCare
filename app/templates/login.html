<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendCare — Iniciar sesión</title>
    <script src="https://unpkg.com/vue@3"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" rel="stylesheet" />
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    gray: {
                        50: '#E4E4DE', 100: '#D8D9CF', 200: '#C4C5BA', 300: '#B0B1A6',
                        400: '#8A8E7A', 500: '#595F39', 600: '#1B1B1B', 700: '#1B1B1B',
                        800: '#1B1B1B', 900: '#0D0D0D',
                    },
                    blue: {
                        50: '#E4E4DE', 100: '#D8D9CF', 200: '#C4C5BA', 300: '#B0B1A6',
                        400: '#8A8E7A', 500: '#595F39', 600: '#1B1B1B', 700: '#1B1B1B',
                        800: '#0D0D0D', 900: '#0D0D0D',
                    },
                    indigo: {
                        100: '#E4E4DE', 200: '#C4C5BA', 300: '#B0B1A6', 400: '#595F39',
                        500: '#595F39', 600: '#1B1B1B', 700: '#1B1B1B', 800: '#0D0D0D',
                    },
                },
            },
        },
    }
    </script>
    <style>
        * { scrollbar-width: thin; scrollbar-color: #C4C5BA transparent; }
        *::-webkit-scrollbar { width: 6px; height: 6px; }
        *::-webkit-scrollbar-track { background: transparent; }
        *::-webkit-scrollbar-thumb { background: #C4C5BA; border-radius: 3px; }
        *::-webkit-scrollbar-thumb:hover { background: #8A8E7A; }
        *::-webkit-scrollbar-corner { background: transparent; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4">

<div id="app">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-emerald-200">
                <i class="ti ti-church text-white text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">AttendCare</h1>
            <p class="text-gray-500 mt-1">Sistema de Registro Ministerial</p>
        </div>

        <div class="bg-white rounded-2xl shadow-xl shadow-gray-200/50 p-8">
            <h2 class="text-lg font-semibold text-gray-800 mb-6">Iniciar sesión</h2>

            <div v-if="error" class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-600 flex items-center gap-2">
                <i class="ti ti-alert-circle"></i>
                <span>[[ error ]]</span>
            </div>

            <form @submit.prevent="login" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
                    <input type="text" v-model="form.username"
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                           placeholder="Ingrese su usuario">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                    <input type="password" v-model="form.password"
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                           placeholder="Ingrese su contraseña">
                </div>

                <button type="submit" :disabled="loading"
                        class="w-full bg-emerald-600 text-white py-2.5 rounded-lg font-medium hover:bg-emerald-700 transition disabled:opacity-50 flex items-center justify-center gap-2">
                    <i v-if="loading" class="ti ti-loader animate-spin"></i>
                    <span>[[ loading ? 'Ingresando...' : 'Ingresar' ]]</span>
                </button>
            </form>

            <div class="mt-6 pt-4 border-t border-gray-100">
                <a href="/kiosko/"
                   class="w-full flex items-center justify-center gap-2 px-4 py-2.5 border-2 border-dashed border-gray-300 rounded-lg text-sm text-gray-500 hover:border-emerald-300 hover:text-emerald-600 hover:bg-emerald-50 transition">
                    <i class="ti ti-device-tablet text-lg"></i>
                    <span>Modo Kiosko</span>
                </a>
            </div>
        </div>
    </div>
</div>

<script>
const { createApp } = Vue

createApp({
    delimiters: ['[[', ']]'],
    data() {
        return {
            form: { username: '', password: '' },
            error: '',
            loading: false
        }
    },
    methods: {
        async login() {
            this.error = ''
            this.loading = true

            try {
                const res = await fetch('/api/auth/login/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(this.form)
                })

                const data = await res.json()

                if (!res.ok) {
                    this.error = data.detail || 'Credenciales incorrectas'
                    this.loading = false
                    return
                }

                localStorage.setItem('access', data.access)
                localStorage.setItem('refresh', data.refresh)
                window.location.href = '/dashboard/'
            } catch (e) {
                this.error = 'Error de conexión'
                this.loading = false
            }
        }
    }
}).mount('#app')
</script>

</body>
</html>
