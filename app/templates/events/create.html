{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow-sm border-0">

        <div class="card-body">

            <h3 class="mb-4">
                Crear evento
            </h3>

            <form method="POST">

                {% csrf_token %}

                <div class="row g-3">

                    <div class="col-md-6">

                        <label class="form-label">
                            Nombre
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">
                            Tipo
                        </label>

                        <select
                            name="type"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Seleccione
                            </option>

                            {% for type in eventTypes %}

                                <option value="{{ type.id }}">
                                    {{ type.name }}
                                </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">
                            Estado
                        </label>

                        <select
                            name="status"
                            class="form-select"
                            required
                        >

                            {% for status in eventStatuses %}

                                <option value="{{ status.id }}">
                                    {{ status.name }}
                                </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">
                            Ministerio líder
                        </label>

                        <select
                            name="leaderMinistry"
                            class="form-select"
                            required
                        >

                            {% for ministry in ministries %}

                                <option value="{{ ministry.id }}">
                                    {{ ministry.name }}
                                </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">
                            Fecha inicio
                        </label>

                        <input
                            type="datetime-local"
                            name="startDate"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">
                            Fecha fin
                        </label>

                        <input
                            type="datetime-local"
                            name="endDate"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="col-12">

                        <label class="form-label">
                            Ministerios participantes
                        </label>

                        <div class="row">

                            {% for ministry in ministries %}

                                <div class="col-md-4 mb-2">

                                    <div class="form-check">

                                        <input
                                            type="checkbox"
                                            name="participantMinistries"
                                            value="{{ ministry.id }}"
                                            class="form-check-input"
                                            id="ministry{{ ministry.id }}"
                                        >

                                        <label
                                            class="form-check-label"
                                            for="ministry{{ ministry.id }}"
                                        >
                                            {{ ministry.name }}
                                        </label>

                                    </div>

                                </div>

                            {% endfor %}

                        </div>

                    </div>

                </div>

                <div class="mt-4">

                    <button class="btn btn-primary">
                        Guardar evento
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
